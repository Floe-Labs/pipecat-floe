[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-floe"
version = "0.2.0"
description = "Floe services for Pipecat — one key for the LLM, STT, and TTS legs of a voice agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Floe Labs" }]
keywords = ["pipecat", "floe", "voice", "llm", "stt", "tts", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pipecat-ai>=1.7.0",
    "websockets>=13.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "floe-guard>=0.19",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "build>=1.0", "pytest>=8"]

[project.urls]
Homepage = "https://floelabs.xyz"
Documentation = "https://floe-labs.gitbook.io/docs"
Repository = "https://github.com/Floe-Labs/pipecat-floe"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_floe"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
